<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cube Earth — Satellite Intelligence for Irish Farms</title>
<meta name="version" content="1.2">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --green:#1a5c38;--green-light:#2d7a50;--green-pale:#e8f5ee;
  --amber:#b45309;--red:#991b1b;
  --text:#111827;--muted:#6b7280;--border:#e5e7eb;
  --surface:#f9fafb;--white:#ffffff;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--serif:'DM Serif Display',serif;
}
body{font-family:var(--sans);color:var(--text);background:var(--white);min-height:100vh;overflow-x:hidden;}
.page{display:none;min-height:100vh;flex-direction:column;}
.page.active{display:flex;}

/* LOGIN */
#page-login{background:linear-gradient(160deg,#0a2e1a 0%,#1a5c38 50%,#0f3d24 100%);align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;}
#page-login::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");}
.login-card{background:rgba(255,255,255,0.97);border-radius:20px;padding:40px 32px;width:100%;max-width:380px;box-shadow:0 25px 60px rgba(0,0,0,0.3);position:relative;z-index:1;}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo .globe{font-size:48px;display:block;margin-bottom:8px;}
.login-logo h1{font-family:var(--serif);font-size:26px;color:var(--green);}
.login-logo p{font-size:12px;color:var(--muted);margin-top:4px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
.form-group input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-family:var(--sans);outline:none;transition:border 0.2s;}
.form-group input:focus{border-color:var(--green);}
.btn-primary{width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer;margin-top:8px;}
.btn-demo{width:100%;padding:12px;background:transparent;color:var(--green);border:1.5px solid var(--green);border-radius:10px;font-size:14px;font-weight:600;font-family:var(--sans);cursor:pointer;margin-top:10px;}
.login-divider{text-align:center;color:var(--muted);font-size:12px;margin:12px 0;position:relative;}
.login-divider::before,.login-divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border);}
.login-divider::before{left:0;}.login-divider::after{right:0;}

/* SELECT */
#page-select{background:var(--white);height:100vh;}
.top-bar{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--white);}
.top-bar h2{font-family:var(--serif);font-size:18px;color:var(--green);flex:1;}
.search-bar{padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);}
.search-row{display:flex;gap:8px;}
.search-row input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:var(--sans);outline:none;}
.search-row input:focus{border-color:var(--green);}
.btn-gps{padding:10px 14px;background:var(--green);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:16px;}
.search-hint{font-size:11px;color:var(--muted);margin-top:6px;}
#select-map{flex:1;min-height:0;height:calc(100vh - 180px);}
.parcel-confirm{padding:16px 18px;background:var(--white);border-top:2px solid var(--green);display:none;}
.parcel-confirm.show{display:block;}
.confirm-info{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.confirm-icon{font-size:32px;}
.confirm-details h3{font-size:16px;font-weight:700;}
.confirm-details p{font-size:12px;color:var(--muted);margin-top:2px;}
.btn-confirm{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:var(--sans);cursor:pointer;}
.btn-confirm:disabled{background:#86efac;cursor:not-allowed;}

/* INTEL */
#page-intel{background:var(--surface);}
.intel-header{padding:14px 18px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.btn-back{background:none;border:none;font-size:22px;cursor:pointer;color:var(--green);}
.intel-header h2{font-family:var(--serif);font-size:17px;color:var(--green);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.match-badge{font-size:11px;padding:3px 8px;border-radius:100px;font-weight:600;white-space:nowrap;}
.match-exact{background:var(--green-pale);color:var(--green);}
.match-near{background:#fef3c7;color:#92400e;}
#intel-map{height:160px;flex-shrink:0;width:100%;}
.intel-scroll{flex:1;overflow-y:auto;padding-bottom:110px;}

/* CARDS */
.card{background:var(--white);border-radius:14px;margin:12px 14px 0;box-shadow:0 1px 4px rgba(0,0,0,0.06);overflow:hidden;}
.card-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;padding:14px 16px 0;}
.card-body{padding:12px 16px 16px;}

/* SUMMARY */
.summary-card{margin:12px 14px 0;background:var(--green);border-radius:14px;padding:18px;color:#fff;}
.summary-type{font-size:11px;font-weight:600;opacity:0.75;text-transform:uppercase;letter-spacing:0.08em;}
.summary-name{font-family:var(--serif);font-size:22px;margin:4px 0 3px;line-height:1.2;}
.summary-meta{font-size:12px;opacity:0.8;}
.summary-stage{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:rgba(255,255,255,0.18);padding:6px 12px;border-radius:100px;font-size:12px;font-weight:600;}

/* DECISIONS */
.dec-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.dec-item{background:var(--surface);border-radius:10px;padding:12px 14px;}
.dec-item.full{grid-column:1/-1;}
.dec-item.highlight{background:var(--green-pale);}
.dec-emoji{font-size:22px;margin-bottom:4px;}
.dec-label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}
.dec-val{font-size:15px;font-weight:700;margin-top:3px;}
.dec-sub{font-size:11px;color:var(--muted);margin-top:2px;}

/* SENSORS */
.sensor-row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.sensor-row:last-child{border-bottom:none;}
.s-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-right:10px;}
.s-dot.green{background:#10b981;}.s-dot.amber{background:#f59e0b;}.s-dot.red{background:#ef4444;}.s-dot.gray{background:#d1d5db;}
.s-name{font-size:13px;flex:1;}
.s-val{font-family:var(--mono);font-size:13px;font-weight:600;}
.s-age{font-size:10px;color:var(--muted);margin-left:8px;white-space:nowrap;}

/* SCORE */
.score-row{display:flex;align-items:center;gap:16px;margin-bottom:14px;}
.score-ring{width:72px;height:72px;flex-shrink:0;position:relative;}
.score-ring svg{transform:rotate(-90deg);}
.score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;font-family:var(--mono);}
.score-level{font-size:16px;font-weight:700;}
.score-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.bar-label{font-size:11px;color:var(--muted);width:72px;flex-shrink:0;}
.bar-track{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;background:var(--green);border-radius:3px;}
.bar-pct{font-size:10px;font-family:var(--mono);color:var(--muted);width:28px;text-align:right;}

/* TREND */
.trend-row{display:flex;align-items:center;gap:14px;padding:12px;background:var(--surface);border-radius:10px;}
.trend-icon{font-size:34px;flex-shrink:0;}
.trend-main{font-size:14px;font-weight:700;}
.trend-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.trend-anomaly{font-size:12px;font-weight:600;margin-top:5px;padding:3px 8px;border-radius:6px;display:inline-block;}
.a-pos{background:#d1fae5;color:#065f46;}.a-neg{background:#fee2e2;color:#991b1b;}.a-neu{background:#fef3c7;color:#92400e;}

/* EVENTS */
.event-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.event-row:last-child{border-bottom:none;}
.ev-emoji{font-size:20px;flex-shrink:0;}
.ev-title{font-size:13px;font-weight:600;}
.ev-date{font-size:11px;color:var(--muted);margin-top:1px;}
.ev-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:100px;margin-top:3px;}
.b-high{background:#fee2e2;color:#991b1b;}.b-mod{background:#fef3c7;color:#92400e;}

/* REPORT */
.report-cta{margin:12px 14px 0;background:linear-gradient(135deg,#1a5c38,#2d7a50);border-radius:14px;padding:22px 18px;color:#fff;text-align:center;}
.report-cta h3{font-family:var(--serif);font-size:20px;margin-bottom:6px;}
.report-cta p{font-size:12px;opacity:0.85;margin-bottom:16px;line-height:1.5;}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.report-opt{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:10px;padding:12px 8px;font-size:11px;font-weight:600;font-family:var(--sans);cursor:pointer;text-align:center;}
.report-opt .price{display:block;font-size:16px;font-weight:700;margin-top:4px;}
.report-full{grid-column:1/-1;background:rgba(255,255,255,0.25);}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:none;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:200;}
.bottom-nav.show{display:flex;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:10px;font-weight:600;font-family:var(--sans);}
.nav-btn.active{color:var(--green);}
.nav-btn .ni{font-size:20px;}
</style>
</head>
<body>

<!-- PAGE 1: LOGIN -->
<div class="page active" id="page-login">
  <div class="login-card">
    <div class="login-logo">
      <span class="globe">🌍</span>
      <h1>Cube Earth</h1>
      <p>Satellite Intelligence for Irish Farms</p>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="login-email" placeholder="farmer@example.ie">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="••••••••">
    </div>
    <button class="btn-primary" onclick="doLogin()">Sign In →</button>
    <div class="login-divider">or</div>
    <button class="btn-demo" onclick="doDemo()">▶ Continue as Demo</button>
  </div>
</div>

<!-- PAGE 2: FIELD SELECTION -->
<div class="page" id="page-select">
  <div class="top-bar">
    <span style="font-size:20px">🌍</span>
    <h2>Select Your Field</h2>
    <span style="font-size:11px;color:var(--muted);background:var(--surface);padding:3px 8px;border-radius:100px;">Demo</span>
  </div>
  <div class="search-bar">
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Eircode or Townland (e.g. Kilcock, W12 X4K2)">
      <button class="btn-gps" onclick="useGPS()">📍</button>
    </div>
    <div class="search-hint">Or tap any field on the map to select it</div>
  </div>
  <div id="select-map"></div>
  <div class="parcel-confirm" id="parcel-confirm">
    <div class="confirm-info">
      <div class="confirm-icon" id="confirm-icon">🌾</div>
      <div class="confirm-details">
        <h3 id="confirm-crop">Tap a field on the map</h3>
        <p id="confirm-meta">Parcel details will appear here</p>
      </div>
    </div>
    <button class="btn-confirm" id="btn-confirm" onclick="confirmField()" disabled>Confirm This Field →</button>
  </div>
</div>

<!-- PAGE 3: INTELLIGENCE -->
<div class="page" id="page-intel">
  <div class="intel-header">
    <button class="btn-back" onclick="showPage('select')">←</button>
    <h2 id="intel-title">Field Intelligence</h2>
    <span class="match-badge" id="match-badge"></span>
  </div>
  <div id="intel-map"></div>
  <div class="intel-scroll" id="intel-scroll">
    <div style="text-align:center;padding:60px 20px;color:var(--muted)">
      <div style="font-size:48px;margin-bottom:12px">🛰</div>
      <div style="font-size:16px;font-weight:600;color:var(--text)">Scanning field...</div>
      <div style="font-size:13px;margin-top:6px">Fetching satellite intelligence</div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav" id="bottom-nav">
  <button class="nav-btn active" onclick="navTo('sec-decisions',this)"><span class="ni">🏠</span>Today</button>
  <button class="nav-btn" onclick="navTo('sec-sensors',this)"><span class="ni">🛰</span>Sensors</button>
  <button class="nav-btn" onclick="navTo('sec-score',this)"><span class="ni">🎯</span>Score</button>
  <button class="nav-btn" onclick="navTo('sec-report',this)"><span class="ni">📄</span>Report</button>
</div>

<script>
let selectMap,intelMap,selectedParcel,selectedLatLng,parcelLayer,highlightLayer;

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.getElementById('bottom-nav').classList.toggle('show',id==='intel');
  if(id==='select') setTimeout(()=>selectMap?.invalidateSize(),150);
  if(id==='intel') setTimeout(()=>intelMap?.invalidateSize(),150);
}

function navTo(id,btn){
  document.getElementById(id)?.scrollIntoView({behavior:'smooth'});
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function doLogin(){
  const e=document.getElementById('login-email').value;
  const p=document.getElementById('login-pass').value;
  if(!e||!p){alert('Please enter email and password');return;}
  startSelect();showPage('select');
}
function doDemo(){startSelect();showPage('select');}

function startSelect(){
  if(selectMap) return;
  selectMap=L.map('select-map').setView([53.4,-7.9],7);
  // Satellite layer
  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri'});
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'});
  satellite.addTo(selectMap);
  L.control.layers({'Satellite':satellite,'Map':osm},{},{position:'topright'}).addTo(selectMap);
  selectMap.on('click',e=>fetchParcel(e.latlng.lat,e.latlng.lng));
  document.getElementById('search-input').addEventListener('keypress',e=>{
    if(e.key==='Enter') searchPlace(e.target.value);
  });
}

async function searchPlace(q){
  if(!q) return;
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q+', Ireland')}&format=json&limit=1`);
    const d=await r.json();
    if(d.length){selectMap.flyTo([+d[0].lat,+d[0].lon],15);fetchParcel(+d[0].lat,+d[0].lon);}
    else alert('Location not found — try a townland or Eircode');
  }catch(e){console.error(e);}
}

function useGPS(){
  if(!navigator.geolocation){alert('GPS not available');return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const{latitude:lat,longitude:lng}=pos.coords;
    if(lat<51.3||lat>55.4||lng<-10.7||lng>-5.9){alert('Outside Ireland bounds');return;}
    selectMap.flyTo([lat,lng],15);fetchParcel(lat,lng);
  },err=>alert('GPS: '+err.message));
}

async function fetchParcel(lat,lng){
  const conf=document.getElementById('parcel-confirm');
  const cropEl=document.getElementById('confirm-crop');
  const metaEl=document.getElementById('confirm-meta');
  const iconEl=document.getElementById('confirm-icon');
  const btn=document.getElementById('btn-confirm');

  cropEl.textContent='Loading parcel...';
  metaEl.textContent='';
  conf.classList.add('show');
  btn.disabled=true;

  if(highlightLayer) selectMap.removeLayer(highlightLayer);
  highlightLayer=L.circleMarker([lat,lng],{radius:8,color:'#1a5c38',fillColor:'#2d7a50',fillOpacity:0.9,weight:2}).addTo(selectMap);

  try{
    const tol=0.005;
    const url=`https://cube-earth.onrender.com/parcel_at_point?lat=${lat}&lng=${lng}`;
    const r=await fetch(url);
    const data=await r.json();
    const features=data.features||[];
    let best=null;
    for(const f of features){
      const c=(f.properties?.CROP||'').toLowerCase();
      if(!['building','road','water',''].includes(c)){best=f;break;}
    }
    if(!best&&features.length) best=features[0];
    if(!best){cropEl.textContent='No parcel found';metaEl.textContent='Try clicking on a field area';return;}

    selectedParcel=best;selectedLatLng={lat,lng};
    if(parcelLayer) selectMap.removeLayer(parcelLayer);
    if(best.geometry){
      parcelLayer=L.geoJSON(best,{style:{color:'#1a5c38',weight:2.5,fillColor:'#2d7a50',fillOpacity:0.25}}).addTo(selectMap);
      selectMap.fitBounds(parcelLayer.getBounds(),{padding:[30,30]});
    }
    const p=best.properties;
    const gl=p.GRASSLND==='Y',ti=p.TILLAGE==='Y',ar=p.ARABL_IND==='Y';
    iconEl.textContent=gl?'🌱':ti?'🌾':ar?'🥕':'🏡';
    cropEl.textContent=p.CROP||'Unknown';
    metaEl.textContent=`${parseFloat(p.CLAIM_AREA||0).toFixed(1)} ha · ${p.OLR||''}${p.ECO==='Y'?' · ECO':''}${p.BISS==='Y'?' · BISS':''}`;
    btn.disabled=false;
  }catch(e){cropEl.textContent='Error: '+e.message;}
}

function getCentroid(geometry){
  if(!geometry||geometry.type!=='Polygon') return null;
  const coords=geometry.coordinates[0];
  if(!coords||!coords.length) return null;
  const lng=coords.reduce((s,c)=>s+c[0],0)/coords.length;
  const lat=coords.reduce((s,c)=>s+c[1],0)/coords.length;
  return {lat,lng};
}

function confirmField(){
  if(!selectedLatLng) return;
  showPage('intel');
  if(intelMap){intelMap.remove();intelMap=null;}
  intelMap=L.map('intel-map',{zoomControl:false,dragging:false,scrollWheelZoom:false,touchZoom:false}).setView([53.4,-7.9],14);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri'}).addTo(intelMap);
  if(selectedParcel?.geometry){
    const l=L.geoJSON(selectedParcel,{style:{color:'#1a5c38',weight:2.5,fillColor:'#2d7a50',fillOpacity:0.3}}).addTo(intelMap);
    intelMap.fitBounds(l.getBounds(),{padding:[20,20]});
  }
  // Use parcel centroid for accurate backend query
  const centroid=getCentroid(selectedParcel?.geometry)||selectedLatLng;
  loadIntel(centroid.lat, centroid.lng);
}

async function loadIntel(lat,lng){
  const scroll=document.getElementById('intel-scroll');
  try{
    // Pass selected parcel properties to avoid re-querying wrong parcel
    const parcelProps = selectedParcel?.properties || {};
    const r=await fetch('https://cube-earth.onrender.com/field_profile',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        lat,lng,year:2026,
        parcel_override:{
          crop:        parcelProps.CROP,
          claim_area:  parseFloat(parcelProps.CLAIM_AREA||0),
          grassland:   parcelProps.GRASSLND==='Y',
          tillage:     parcelProps.TILLAGE==='Y',
          arable:      parcelProps.ARABL_IND==='Y',
          permanent:   parcelProps.PERM_IND==='Y',
          biss:        parcelProps.BISS==='Y',
          eco:         parcelProps.ECO==='Y',
          olr:         parcelProps.OLR,
          par_lab:     parcelProps.PAR_LAB,
        }
      })
    });
    const d=await r.json();
    if(!d.success){scroll.innerHTML=`<div style="padding:40px;text-align:center;color:var(--red)">⚠ ${d.detail||'Failed'}</div>`;return;}
    renderIntel(d);
  }catch(e){
    scroll.innerHTML=`<div style="padding:40px;text-align:center;color:var(--red)">⚠ ${e.message}</div>`;
  }
}

const dot=age=>age===null||age===undefined?'gray':age<=3?'green':age<=14?'amber':'red';
const ndviLabel=v=>v===null||v===undefined?'—':v>0.75?'Excellent':v>0.55?'High':v>0.35?'Moderate':v>0.20?'Low':'Very low';
const smLabel=v=>v===null||v===undefined?'—':v>0.35?'Wet':v>0.25?'Adequate':v>0.15?'Dry':'Very dry';

function renderIntel(d){
  const scroll=document.getElementById('intel-scroll');
  const p=d.parcel||{},v=d.vegetation||{},ag=d.agronomic||{};
  const sm=d.soil_moisture||{},vt=d.vegetation_trend||{};
  const sar=d.sar||{},thermal=d.thermal||{};
  const conf=d.confidence||{},fresh=d.freshness||{};
  const modis=d.modis||{},pc=d.parcel_context||{};

  document.getElementById('intel-title').textContent=p.crop||'Field Intelligence';
  const dist=pc.match_distance_m;
  const badge=document.getElementById('match-badge');
  badge.textContent=dist<100?`✓ ${dist}m`:`~ ${dist}m`;
  badge.className='match-badge '+(dist<100?'match-exact':'match-near');

  const gl=p.grassland,ti=p.tillage,ar=p.arable;
  const cropIcon=gl?'🌱':ti?'🌾':ar?'🥕':'🏡';
  const cropType=gl?'Grassland':ti?'Tillage':ar?'Arable':'Field';
  const stage=ag.crop_stage;
  const ndvi=v.ndvi;
  const smapVal=sm.smap?.sm_surface_m3;
  const grazing=ag.grazing_suitability||ag.grazing;
  const machinery=ag.machinery_trafficability||ag.machinery;
  const trend=vt.long_trend||'stable';
  const tIcon=trend==='strong_increase'?'📈':trend==='increasing'?'↗️':trend==='stable'?'➡️':trend==='declining'?'↘️':'📉';
  const tLabel=vt.interpretation?.trend_label||vt.trend_label||'Stable';
  const aPct=vt.seasonal?.anomaly_pct;
  const aClass=aPct>20?'a-pos':aPct<-20?'a-neg':'a-neu';
  const aLabel=aPct!==null&&aPct!==undefined?(aPct>0?'+':'')+aPct+'% vs seasonal baseline':'';
  const score=conf.score||0;
  const C=2*Math.PI*28;
  const DO=C-(score/10)*C;
  const contribs=conf.contributions||{};
  const events=vt.events||[];

  scroll.innerHTML=`
  <div class="summary-card">
    <div class="summary-type">${cropIcon} ${cropType}</div>
    <div class="summary-name">${p.crop||'Unknown'}</div>
    <div class="summary-meta">${(p.claim_area||0).toFixed(1)} ha · ${p.olr||''} · ${d.terrain?.elevation_m||'—'}m</div>
    ${stage?`<div class="summary-stage">📅 ${stage.label}</div>`:''}
  </div>

  <div class="card" id="sec-decisions">
    <div class="card-label">Field Overview</div>
    <div class="card-body">
      <div class="dec-grid">
        <div class="dec-item"><div class="dec-emoji">🌾</div><div class="dec-label">Crop Canopy</div><div class="dec-val">${ndviLabel(ndvi)}</div><div class="dec-sub">NDVI ${ndvi?.toFixed(3)||'—'}</div></div>
        <div class="dec-item"><div class="dec-emoji">💧</div><div class="dec-label">Soil Moisture</div><div class="dec-val">${smLabel(smapVal)}</div><div class="dec-sub">${smapVal?.toFixed(3)||'—'} m³/m³</div></div>
        ${stage?`<div class="dec-item full highlight"><div class="dec-emoji">📅</div><div class="dec-label">Crop Stage</div><div class="dec-val">${stage.label}</div><div class="dec-sub">${stage.advice}</div></div>`:''}
      </div>
      <div style="margin-top:10px;padding:12px;background:#f0fdf4;border:1.5px dashed #86efac;border-radius:10px;text-align:center">
        <div style="font-size:13px;font-weight:700;color:var(--green)">🔒 Full Field Decisions</div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">Machinery · Grazing · Slurry timing · Stage advice</div>
        <div style="font-size:11px;font-weight:600;color:var(--green);margin-top:6px">Unlock with Sensor Report — €2.99</div>
      </div>
    </div>
  </div>

  <div class="card" id="sec-sensors">
    <div class="card-label">🛰 Live Sensors</div>
    <div class="card-body">
      <div class="sensor-row"><div class="s-dot ${dot(fresh.sentinel2?.age_days)}"></div><div class="s-name">Sentinel-2 NDVI</div><div class="s-val">${ndvi?.toFixed(3)||'—'}</div><div class="s-age">${fresh.sentinel2?.age_days||'—'}d · 10m</div></div>
      <div style="margin-top:8px;padding:12px;background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:10px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <div class="s-dot gray"></div><div class="s-name" style="color:var(--muted)">SMAP Moisture</div><div style="font-size:12px;color:#94a3b8">🔒 locked</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <div class="s-dot gray"></div><div class="s-name" style="color:var(--muted)">SAR Radar RVI</div><div style="font-size:12px;color:#94a3b8">🔒 locked</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <div class="s-dot gray"></div><div class="s-name" style="color:var(--muted)">Thermal LST</div><div style="font-size:12px;color:#94a3b8">🔒 locked</div>
        </div>
        <div style="text-align:center;padding-top:8px;border-top:1px solid var(--border)">
          <div style="font-size:12px;font-weight:700;color:var(--green)">Unlock all 5 sensors — €2.99</div>
          <button onclick="alert('Coming soon — Sensor Report')" style="margin-top:8px;padding:8px 20px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans)">Get Sensor Report →</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">📈 Vegetation Trend</div>
    <div class="card-body">
      <div class="trend-row">
        <div class="trend-icon">${tIcon}</div>
        <div>
          <div class="trend-main">${tLabel}</div>
          <div class="trend-sub">${vt.count||0} observations · 90 days</div>
          ${aLabel?`<span class="trend-anomaly ${aClass}">${aLabel}</span>`:''}
        </div>
      </div>
      ${events.length?`<div style="margin-top:12px">${events.map(e=>`
      <div class="event-row">
        <div class="ev-emoji">${e.type==='harvest_or_cut'?'🌾':e.type==='bare_soil'?'🟤':'🌱'}</div>
        <div><div class="ev-title">${e.label}</div><div class="ev-date">${e.date}</div><span class="ev-badge ${e.confidence==='high'?'b-high':'b-mod'}">${e.confidence}</span></div>
      </div>`).join('')}</div>`:
      `<div style="margin-top:10px;font-size:12px;color:var(--muted)">✓ No significant events detected</div>`}
    </div>
  </div>

  <div class="card" id="sec-score">
    <div class="card-label">🎯 Data Confidence</div>
    <div class="card-body">
      <div class="score-row">
        <div class="score-ring">
          <svg width="72" height="72" viewBox="0 0 72 72">
            <circle cx="36" cy="36" r="28" fill="none" stroke="#e5e7eb" stroke-width="7"/>
            <circle cx="36" cy="36" r="28" fill="none" stroke="#1a5c38" stroke-width="7" stroke-dasharray="${C}" stroke-dashoffset="${DO}" stroke-linecap="round"/>
          </svg>
          <div class="score-num">${score}</div>
        </div>
        <div><div class="score-level">${conf.level||'Operational'}</div><div class="score-sub">Uncertainty: ${conf.uncertainty_label||'Moderate'}</div><div class="score-sub">Agreement: ${d.agreement?.score?.toFixed(1)||'—'}/10</div></div>
      </div>
      ${Object.entries(contribs).slice(0,5).map(([k,v])=>`
      <div class="bar-row">
        <div class="bar-label">${k==='Sentinel-2'?'Optical':k==='SMAP'?'Moisture':k==='ERA5'?'Weather':k==='Sentinel-1'?'Radar':'Thermal'}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${v.percent||0}%"></div></div>
        <div class="bar-pct">${v.percent||0}%</div>
      </div>`).join('')}
    </div>
  </div>

  <div class="report-cta" id="sec-report">
    <h3>Full Field Report</h3>
    <p>Professional PDF with complete sensor analysis, compliance evidence and agronomic recommendations.</p>
    <div class="report-grid">
      <button class="report-opt" onclick="alert('Coming soon')">Sensor Report<span class="price">€2.99</span></button>
      <button class="report-opt" onclick="alert('Coming soon')">Data Quality<span class="price">€2.99</span></button>
      <button class="report-opt report-full" onclick="alert('Coming soon')">Full PDF Field Report<span class="price">€7.99</span></button>
    </div>
  </div>`;
}
</script>
</body>
</html>
